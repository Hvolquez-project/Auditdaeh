# ════════════════════════════════════════════════════════════
#  Netlify configuration
# ════════════════════════════════════════════════════════════

[build]
  publish    = "."
  functions  = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Atajo: /api/data → /.netlify/functions/data
[[redirects]]
  from   = "/api/data"
  to     = "/.netlify/functions/data"
  status = 200
